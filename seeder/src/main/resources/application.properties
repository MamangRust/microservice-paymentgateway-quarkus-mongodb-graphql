# Seeder orchestrator — minimal Quarkus app
quarkus.application.name=seeder

# Disable HTTP server (one-shot runner)
quarkus.http.port=-1

# Disable extensions not needed by seeder
quarkus.scheduler.enabled=false

# Exclude ALL non-seeder CDI beans — seeder uses ServiceLoader, not CDI
quarkus.arc.exclude-patterns=\
  com.sanedge.common.chaos.**,\
  com.sanedge.common.observability.**,\
  com.sanedge.common.exception.**,\
  com.sanedge.common.config.**,\
  com.sanedge.common.grpc.**,\
  com.sanedge.auth.service.**,\
  com.sanedge.auth.handler.**,\
  com.sanedge.auth.repository.**,\
  com.sanedge.role.service.**,\
  com.sanedge.role.handler.**,\
  com.sanedge.role.repository.**,\
  com.sanedge.user.service.**,\
  com.sanedge.user.handler.**,\
  com.sanedge.user.repository.**,\
  com.sanedge.card.service.**,\
  com.sanedge.card.handler.**,\
  com.sanedge.card.repository.**,\
  com.sanedge.merchant.service.**,\
  com.sanedge.merchant.handler.**,\
  com.sanedge.merchant.repository.**,\
  com.sanedge.saldo.service.**,\
  com.sanedge.saldo.handler.**,\
  com.sanedge.saldo.repository.**,\
  com.sanedge.topup.service.**,\
  com.sanedge.topup.handler.**,\
  com.sanedge.topup.repository.**,\
  com.sanedge.transaction.service.**,\
  com.sanedge.transaction.handler.**,\
  com.sanedge.transaction.repository.**,\
  com.sanedge.transfer.service.**,\
  com.sanedge.transfer.handler.**,\
  com.sanedge.transfer.repository.**,\
  com.sanedge.withdraw.service.**,\
  com.sanedge.withdraw.handler.**,\
  com.sanedge.withdraw.repository.**

# MongoDB — one named client per bounded context (see PGTOMONGODB.md §1.1).
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.devservices.enabled=false

# Default client: required because the domain modules pull in the Mongo Panache
# extension. Domain repositories are excluded from CDI, so it is only needed to
# satisfy the extension; seeders always resolve their own context via ctx.db().
quarkus.mongodb.connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb.database=pg_identity

quarkus.mongodb."identity".connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb."identity".database=pg_identity
quarkus.mongodb."payment".connection-string=mongodb://${MONGO_PAYMENT_HOST:localhost}:${MONGO_PAYMENT_PORT:27017}
quarkus.mongodb."payment".database=pg_payment
quarkus.mongodb."financial".connection-string=mongodb://${MONGO_FINANCIAL_HOST:localhost}:${MONGO_FINANCIAL_PORT:27017}
quarkus.mongodb."financial".database=pg_financial

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
