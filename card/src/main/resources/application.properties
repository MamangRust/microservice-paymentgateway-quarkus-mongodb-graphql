quarkus.grpc.server.port=9004
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8084
quarkus.http.host=0.0.0.0

quarkus.mongodb.connection-string=mongodb://${MONGO_PAYMENT_HOST:localhost}:${MONGO_PAYMENT_PORT:27017}
quarkus.mongodb.database=${MONGO_PAYMENT_DB:pg_payment}
quarkus.mongodb.uuid-representation=standard

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

quarkus.grpc.clients.user.host=${USER_SERVICE_HOST:localhost}
quarkus.grpc.clients.user.port=${USER_SERVICE_GRPC_PORT:9011}

# Kafka (brokers dari env deployment KAFKA_BROKERS; fallback lokal untuk dev/test)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BROKERS:localhost:9092}}

# Kafka Consumer Groups
kafka.group.id=card-fraud-scoring-group

# Redis
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis-node-1:6379}
quarkus.redis.client-type=${REDIS_CLIENT_TYPE:cluster}

# Transactional outbox relay (F3)
outbox.lease.seconds=300
outbox.publisher.batch-size=50
