# --- Server: no HTTP/gRPC surface needed, pure consumer ---
quarkus.http.port=8095
quarkus.http.host=0.0.0.0

# --- Kafka (brokers dari env deployment; fallback lokal untuk dev) ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BROKERS:localhost:9092}}
kafka.group.id=${KAFKA_GROUP_ID:stats-writer-group}

# Topics yang di-consume (stats.payment.* dari outbox F3 + legacy nama topic Go)
stats.topics=${STATS_TOPICS:stats.payment.transaction.event,stats.payment.topup.event,stats.payment.transfer.event,stats.payment.withdraw.event,stats.payment.saldo.event,stats.payment.merchant.event,stats.payment.card.event}

# --- ClickHouse ---
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.http-port=${CLICKHOUSE_HTTP_PORT:8123}
clickhouse.database=${CLICKHOUSE_DATABASE:payment_stats}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:none}

# --- Batching (mirror Go: 1000 rows / 5s flush) ---
stats.batch-size=${STATS_BATCH_SIZE:1000}
stats.flush-interval-seconds=${STATS_FLUSH_INTERVAL_SECONDS:5}

# Dedup window (jam) — event_id dari EventEnvelope outbox
stats.dedup-window-hours=${STATS_DEDUP_WINDOW_HOURS:48}

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=INFO
