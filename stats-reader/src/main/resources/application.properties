quarkus.grpc.server.port=9015
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8096
quarkus.http.host=0.0.0.0

# --- ClickHouse ---
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.http-port=${CLICKHOUSE_HTTP_PORT:8123}
clickhouse.database=${CLICKHOUSE_DATABASE:payment_stats}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:none}

# --- Redis (cache-aside; keys di-namespace apigw:stats: — F6) ---
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis-node-1:6379}
quarkus.redis.client-type=${REDIS_CLIENT_TYPE:cluster}
stats.cache.enabled=${STATS_CACHE_ENABLED:true}
stats.cache.ttl-seconds=${STATS_CACHE_TTL_SECONDS:300}

quarkus.arc.remove-unused-beans=true

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=INFO
