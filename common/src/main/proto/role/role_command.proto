syntax = "proto3";

option go_package = 'github.com/MamangRust/monolith-payment-gateway-pb/role';

package pb.role;

import "google/protobuf/empty.proto";
import "role/role.proto";

message CreateRoleRequest { string name = 1; }

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
}

message ApiResponseRoleAll {
  string status = 1;
  string message = 2;
}

message ApiResponseRoleDelete {
  string status = 1;
  string message = 2;
}

message UserRoleResponse {
  string user_role_id = 1;
  string user_id = 2;
  string role_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

message ApiResponseUserRole {
  string status = 1;
  string message = 2;
  UserRoleResponse data = 3;
}

message AssignRoleToUserRequest {
  string user_id = 1;
  string role_id = 2;
}

message RemoveRoleFromUserRequest {
  string user_id = 1;
  string role_id = 2;
}

service RoleCommandService {
  rpc CreateRole(CreateRoleRequest) returns (ApiResponseRole) {}
  rpc UpdateRole(UpdateRoleRequest) returns (ApiResponseRole) {}
  rpc TrashedRole(FindByIdRoleRequest) returns (ApiResponseRoleDeleteAt) {}
  rpc RestoreRole(FindByIdRoleRequest) returns (ApiResponseRoleDeleteAt) {}
  rpc DeleteRolePermanent(FindByIdRoleRequest) returns (ApiResponseRoleDelete) {}
  rpc RestoreAllRole(google.protobuf.Empty) returns (ApiResponseRoleAll) {}
  rpc DeleteAllRolePermanent(google.protobuf.Empty) returns (ApiResponseRoleAll) {}

  rpc AssignRoleToUser(AssignRoleToUserRequest) returns (ApiResponseUserRole) {}
  rpc RemoveRoleFromUser(RemoveRoleFromUserRequest) returns (google.protobuf.Empty) {}
}