quarkus.grpc.server.port=9009
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8089
quarkus.http.host=0.0.0.0

quarkus.mongodb.connection-string=mongodb://${MONGO_FINANCIAL_HOST:localhost}:${MONGO_FINANCIAL_PORT:27017}
quarkus.mongodb.database=${MONGO_FINANCIAL_DB:pg_financial}
quarkus.mongodb.uuid-representation=standard

# (covers saldo/topup/transaction/transfer/withdraw tables, idempotency and
# compensation columns — the financial schema is coupled by design)

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

quarkus.grpc.clients.card.host=${CARD_SERVICE_HOST:localhost}
quarkus.grpc.clients.card.port=${CARD_SERVICE_GRPC_PORT:9004}

quarkus.grpc.clients.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
quarkus.grpc.clients.merchant.port=${MERCHANT_SERVICE_GRPC_PORT:9005}

quarkus.grpc.clients.saldo.host=${SALDO_SERVICE_HOST:localhost}
quarkus.grpc.clients.saldo.port=${SALDO_SERVICE_GRPC_PORT:9007}

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BROKERS:localhost:9092}}
kafka.acks=${KAFKA_ACKS:1}

# Durable compensation reconciliation worker
transaction.reconciliation.enabled=${RECONCILIATION_ENABLED:true}
transaction.reconciliation.interval-ms=${RECONCILIATION_INTERVAL_MS:30000}
transaction.reconciliation.max-attempts=${RECONCILIATION_MAX_ATTEMPTS:5}
transaction.reconciliation.lease-minutes=${RECONCILIATION_LEASE_MINUTES:2}

# Redis
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis-node-1:6379}
quarkus.redis.client-type=${REDIS_CLIENT_TYPE:cluster}

# Transactional outbox relay (F3)
outbox.lease.seconds=300
outbox.publisher.batch-size=50
