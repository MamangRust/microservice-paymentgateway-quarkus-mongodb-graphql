# Stats backfill runner: reads OLTP collections and enqueues historical events
# into each domain's outbox (relayed to Kafka by the F3 OutboxPublisher).
quarkus.application.name=stats-backfill

# One-shot job: no HTTP layer.
quarkus.http.port=-1

quarkus.arc.exclude-patterns=\
  com.sanedge.common.chaos.**,\
  com.sanedge.common.config.RedisService,\
  com.sanedge.common.observability.**,\
  com.sanedge.common.utils.JwtUtil,\
  com.sanedge.common.exception.mapper.**,\
  com.sanedge.common.grpc.**

# MongoDB — one named client per bounded context (see PGTOMONGODB.md §1.1).
# The backfill reads the financial context (transaction/topup/transfer/withdraw)
# and the payment context (saldo/merchant/card), then writes each domain's outbox.
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.devservices.enabled=false

# Default client: required because the domain modules pull in the Mongo Panache
# extension. The backfill always resolves its own context via @MongoClientName.
quarkus.mongodb.connection-string=mongodb://${MONGO_PAYMENT_HOST:localhost}:${MONGO_PAYMENT_PORT:27017}
quarkus.mongodb.database=pg_payment

quarkus.mongodb."payment".connection-string=mongodb://${MONGO_PAYMENT_HOST:localhost}:${MONGO_PAYMENT_PORT:27017}
quarkus.mongodb."payment".database=pg_payment
quarkus.mongodb."financial".connection-string=mongodb://${MONGO_FINANCIAL_HOST:localhost}:${MONGO_FINANCIAL_PORT:27017}
quarkus.mongodb."financial".database=pg_financial

# Domains to backfill (comma-separated). all = every domain.
backfill.domains=${BACKFILL_DOMAINS:all}

# Optional lower bound on created_at (ISO, e.g. 2024-01-01T00:00:00Z). none = no bound.
backfill.from=${BACKFILL_FROM:none}

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=INFO
