apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: payment-gateway
spec:
  # Wajib: default-deny memblokir egress, termasuk ke CoreDNS. Tanpa policy ini
  # semua resolusi nama (mongo-*.svc.cluster.local, kafka, ...) gagal dan
  # seluruh stack mati.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
