apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-email-smtp-egress
  namespace: payment-gateway
spec:
  # Satu-satunya egress ke luar cluster yang dibutuhkan aplikasi: email-service
  # (dan alertmanager) mengirim SMTP ke smtp.ethereal.email:587.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - email
          - alertmanager
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 587
