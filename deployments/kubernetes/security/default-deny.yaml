apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payment-gateway
spec:
  # podSelector kosong = semua pod di namespace ini.
  #
  # Tanpa rule sama sekali: seluruh ingress & egress ditolak. Policy lain di
  # folder ini (dan `network-policy.yaml` per service) bersifat aditif, jadi
  # masing-masing hanya menambahkan lubang yang memang dibutuhkan.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
