apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Dipakai bersama oleh root (deployments/kubernetes) dan overlays/production.
# Kustomize melarang overlay memuat file patch di luar root-nya sendiri, jadi
# patch imagePullSecrets dijadikan component yang bisa dirujuk dari dua tempat.
#
# Secret `ghcr-pull-secret` dibuat oleh core/secrets.yaml (ExternalSecret).
# Tanpa secret itu pod gagal start ("Unable to retrieve some image pull
# secrets"), bukan sekadar gagal pull — lihat README bagian How to Use.
patches:
- path: image-pull-secret-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(ai-security|apigateway|auth|card|email|merchant|role|saldo|stats-reader|stats-writer|topup|transaction|transfer|user|withdraw)$"
# Job pgw (`redis-cluster-init`, `kafka-create-email-topics`) memakai image
# infra, bukan image aplikasi dari ghcr, jadi tidak butuh pull secret. Patch ini
# sengaja tetap ada supaya file-set component sama dengan repo saudara, dan
# otomatis berlaku kalau nanti ada Job ber-image aplikasi (mis. backfill).
- path: job-image-pull-secret-patch.yaml
  target:
    group: batch
    version: v1
    kind: Job
    name: "^(migrate|stats-backfill)$"
