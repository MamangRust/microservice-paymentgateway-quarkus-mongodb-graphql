apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Redis cluster 6 node. PVC-nya datang dari volumeClaimTemplates StatefulSet,
# bukan manifest terpisah.
resources:
  - redis-deployment.yaml # StatefulSet redis (6 replica)
  - redis-service.yaml # Service redis
  - redis-cluster-init-job.yaml # Job redis-cluster-init
