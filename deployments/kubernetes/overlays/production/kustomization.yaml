apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entrypoint production (ArgoCD): path ini yang dipakai
# deployments/gitops/argocd/production/production.yaml.
#
# Root `deployments/kubernetes` sengaja TIDAK dirujuk langsung (`resources:
# [../..]`) — kustomize menolak overlay yang menunjuk ancestor-nya sendiri
# (cycle detected), dan load restrictor-nya melarang overlay memuat file biasa
# di luar direktorinya. Karena itu tiap folder kategori didaftarkan eksplisit,
# dan `namespace.yaml` ikut lewat `core/`.

namespace: payment-gateway

resources:
  - ../../core
  - ../../security
  - ../../database
  - ../../messaging
  - ../../cache
  - ../../observability
  - ../../networking
  - ../../services

# Image aplikasi. Manifest hanya menulis placeholder `__GHCR_OWNER__`; blok
# `replacements` di bawah mengganti segmen owner dari app-config/GHCR_OWNER.
#
# newTag sengaja `latest`: CI (.github/workflows/build_and_push.yaml) baru
# mem-publish tag `latest` + tag branch/semver, belum ada tag commit SHA.
# Blok ini tetap ditulis supaya saat CI mulai mem-pin SHA immutable, satu-satunya
# tempat yang perlu diubah sudah ada di sini (pola yang sama dengan repo saudara).
images:
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/ai-security
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/apigateway
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/auth
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/card
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/email
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/merchant
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/role
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/saldo
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/stats-reader
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/stats-writer
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/topup
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/transaction
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/transfer
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/user
    newTag: latest
  - name: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/withdraw
    newTag: latest

# GHCR image owner templating.
#
# Manifest menulis `ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/<svc>`.
# Blok `images` di atas cocok dengan nama ber-placeholder itu (jadi newTag
# dipin di sini), dan blok ini mengganti segmen owner dengan nilai nyata dari
# app-config/GHCR_OWNER. GHCR_OWNER harus sama dengan github.repository_owner
# (lowercase) repo yang CI-nya push ke ghcr.io/<owner>/microservice-payment-gateway-grpc/...
# — di fork, cukup ubah nilai ConfigMap itu.
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.GHCR_OWNER
    targets:
      - select:
          kind: Deployment
          name: "^(ai-security|apigateway|auth|card|email|merchant|role|saldo|stats-reader|stats-writer|topup|transaction|transfer|user|withdraw)$"
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: "/"
          index: 1

components:
  - ../../components/image-pull-secret

patches:
  # Urutan wave: MongoDB "-2" -> workload aplikasi "2". Tanpa proxy pooling
  # (driver Mongo yang menangani pool), jadi tidak ada wave "-1".
  - path: mongo-wave.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: "^(mongo-identity|mongo-payment|mongo-financial)$"
  - path: workload-wave.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(ai-security|apigateway|auth|card|email|merchant|role|saldo|stats-reader|stats-writer|topup|transaction|transfer|user|withdraw)$"
