apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: payment-gateway
spec:
  serviceName: "kafka"
  replicas: 3
  # Parallel supaya ketiga voter KRaft naik bersamaan — dengan OrderedReady,
  # kafka-0 harus Ready dulu sebelum kafka-1 dibuat, padahal quorum 3 voter
  # baru terbentuk setelah mayoritas anggotanya hidup.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      # Image apache/kafka jalan sebagai uid/gid 1000 (appuser).
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          # Image apache/kafka tidak punya trik NODE_ID_COMMAND ala bitnami;
          # KAFKA_NODE_ID wajib numerik, jadi ordinal pod diturunkan dari
          # $HOSTNAME (kafka-0 -> 0) di wrapper ini. ADVERTISED_LISTENERS juga
          # dirakit di sini karena $(HOSTNAME) tidak bisa di-expand oleh
          # substitusi env Kubernetes (HOSTNAME bukan env yang kita deklarasikan).
          command:
            - bash
            - -c
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.payment-gateway.svc.cluster.local:9092"
              echo "[BOOT] node.id=${KAFKA_NODE_ID} advertised=${KAFKA_ADVERTISED_LISTENERS}"
              exec /etc/kafka/docker/run
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.payment-gateway.svc.cluster.local:9093,1@kafka-1.kafka.payment-gateway.svc.cluster.local:9093,2@kafka-2.kafka.payment-gateway.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # CLUSTER_ID (bukan KAFKA_CLUSTER_ID) adalah key yang benar-benar
            # dibaca /etc/kafka/docker/configure. Disamakan dengan compose lokal.
            - name: CLUSTER_ID
              value: "5L6g3nShT-eMCtK--X86sw"
            # Tanpa ini image memakai default /tmp/kraft-combined-logs yang
            # hilang tiap restart pod.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
