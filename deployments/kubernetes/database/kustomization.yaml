apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1 database = 1 bounded context. Tiap context punya instance MongoDB sendiri
# (PGTOMONGODB.md §1.1); service connect lewat MONGO_<CONTEXT>_* (lihat
# core/configmaps.yaml). Tanpa PgBouncer — pooling ditangani driver Mongo.
resources:
  - mongo-identity.yaml # StatefulSet + PVC + headless Service -> pg_identity
  - mongo-payment.yaml # StatefulSet + PVC + headless Service -> pg_payment
  - mongo-financial.yaml # StatefulSet + PVC + headless Service -> pg_financial
  - mongo-network-policy.yaml # NetworkPolicy untuk ketiga instance
  - clickhouse.yaml # StatefulSet + Service -> OLAP (stats-reader/stats-writer)
  - clickhouse-schema-configmap.yaml # ConfigMap clickhouse-schema (initdb mount)
