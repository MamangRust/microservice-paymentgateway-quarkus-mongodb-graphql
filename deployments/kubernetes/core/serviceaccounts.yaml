apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: payment-gateway
# Sengaja TANPA Role/RoleBinding: tidak ada satu pun workload di namespace ini
# yang berbicara ke API server (tidak ada operator, controller, atau job yang
# membuat/membaca objek Kubernetes). Jadi izin paling sedikit = nol izin.
#
# automountServiceAccountToken: false mencegah token API ditempelkan ke pod,
# sehingga kalaupun ada RCE di dalam container, tidak ada kredensial cluster
# yang bisa dipakai. Semua workload mereferensikan ServiceAccount ini lewat
# `serviceAccountName: app` + `automountServiceAccountToken: false`.
automountServiceAccountToken: false
