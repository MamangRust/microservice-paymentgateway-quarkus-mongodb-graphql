apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore dibuat di luar repo (cluster-scoped, berisi kredensial
    # ke secret backend). Lihat prasyarat di deployments/kubernetes/README.md.
    name: payment-gateway-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Dipakai via envFrom oleh semua pod aplikasi.
    - secretKey: SECRET_KEY
      remoteRef:
        key: payment-gateway/SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: payment-gateway/REDIS_PASSWORD
    # Dipakai via secretKeyRef oleh grafana-deployment.
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: payment-gateway/GF_SECURITY_ADMIN_PASSWORD
    # Dipakai via secretKeyRef oleh clickhouse StatefulSet dan via envFrom
    # oleh stats-reader / stats-writer / ai-security.
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: payment-gateway/CLICKHOUSE_PASSWORD
    - secretKey: SMTP_USER
      remoteRef:
        key: payment-gateway/SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: payment-gateway/SMTP_PASS
