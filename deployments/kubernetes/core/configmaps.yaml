apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: payment-gateway
data:
  APP_ENV: "kubernetes"
  # 1 database = 1 bounded context: tiap context punya instance MongoDB sendiri
  # (database/mongo-*.yaml), tanpa proxy (pooling di driver). Prefix env per
  # context dipilih lewat quarkus.mongodb.* di application.properties tiap modul
  # (PGTOMONGODB.md §2.9).
  MONGO_IDENTITY_HOST: "mongo-identity.payment-gateway.svc.cluster.local"
  MONGO_IDENTITY_PORT: "27017"
  MONGO_IDENTITY_DB: "pg_identity"
  MONGO_PAYMENT_HOST: "mongo-payment.payment-gateway.svc.cluster.local"
  MONGO_PAYMENT_PORT: "27017"
  MONGO_PAYMENT_DB: "pg_payment"
  MONGO_FINANCIAL_HOST: "mongo-financial.payment-gateway.svc.cluster.local"
  MONGO_FINANCIAL_PORT: "27017"
  MONGO_FINANCIAL_DB: "pg_financial"

  # GHCR image owner — must match github.repository_owner (lowercase) of the
  # repository whose CI pushes images to ghcr.io/<owner>/microservice-payment-gateway-grpc/...
  # Manifest hanya menulis placeholder `__GHCR_OWNER__`; nilai ini di-substitusi
  # oleh blok `replacements` di overlays/production/kustomization.yaml.
  GHCR_OWNER: "mamangrust"

  SMTP_SERVER: smtp.ethereal.email
  SMTP_PORT: "587"

  APP_LOGGER: "kubernetes"

  KAFKA_BROKERS: "kafka.payment-gateway.svc.cluster.local:9092"
  # ai-security (Python) membaca KAFKA_SERVERS, bukan KAFKA_BROKERS.
  KAFKA_SERVERS: "kafka.payment-gateway.svc.cluster.local:9092"

  REDIS_ADDRS: "redis-0.redis.payment-gateway.svc.cluster.local:6379,redis-1.redis.payment-gateway.svc.cluster.local:6379,redis-2.redis.payment-gateway.svc.cluster.local:6379,redis-3.redis.payment-gateway.svc.cluster.local:6379,redis-4.redis.payment-gateway.svc.cluster.local:6379,redis-5.redis.payment-gateway.svc.cluster.local:6379"
  REDIS_DB: "0"

  # OLAP (stats-reader / stats-writer). CLICKHOUSE_ADDR menang atas HOST/PORT
  # di pkg/clickhouse/connect.go. Password ada di Secret app-secrets.
  CLICKHOUSE_ADDR: "clickhouse.payment-gateway.svc.cluster.local:9000"
  CLICKHOUSE_DATABASE: "default"
  CLICKHOUSE_USERNAME: "dragon"

  OTEL_ENDPOINT: "otel-collector.payment-gateway.svc.cluster.local:4317"

  GRPC_AUTH_ADDR: "auth.payment-gateway.svc.cluster.local:50051"
  GRPC_ROLE_ADDR: "role.payment-gateway.svc.cluster.local:50052"
  GRPC_CARD_ADDR: "card.payment-gateway.svc.cluster.local:50053"
  GRPC_MERCHANT_ADDR: "merchant.payment-gateway.svc.cluster.local:50054"
  GRPC_USER_ADDR: "user.payment-gateway.svc.cluster.local:50055"
  GRPC_SALDO_ADDR: "saldo.payment-gateway.svc.cluster.local:50056"
  GRPC_TOPUP_ADDR: "topup.payment-gateway.svc.cluster.local:50057"
  GRPC_TRANSACTION_ADDR: "transaction.payment-gateway.svc.cluster.local:50058"
  GRPC_TRANSFER_ADDR: "transfer.payment-gateway.svc.cluster.local:50059"
  GRPC_WITHDRAW_ADDR: "withdraw.payment-gateway.svc.cluster.local:50060"
  GRPC_AI_SECURITY_ADDR: "ai-security.payment-gateway.svc.cluster.local:50051"
  GRPC_STATS_READER_ADDR: "stats-reader.payment-gateway.svc.cluster.local:50062"

  GRPC_AUTH_PORT: "50051"
  GRPC_ROLE_PORT: "50052"
  GRPC_CARD_PORT: "50053"
  GRPC_MERCHANT_PORT: "50054"
  GRPC_USER_PORT: "50055"
  GRPC_SALDO_PORT: "50056"
  GRPC_TOPUP_PORT: "50057"
  GRPC_TRANSACTION_PORT: "50058"
  GRPC_TRANSFER_PORT: "50059"
  GRPC_WITHDRAW_PORT: "50060"

  # ai-security client (Python gRPC server on 50051) consumed by
  # transaction (DetectFraud), withdraw and transfer (VerifySecurity).
  GRPC_CLIENT_AI_SECURITY_HOST: "ai-security.payment-gateway.svc.cluster.local"
  GRPC_CLIENT_AI_SECURITY_PORT: "50051"
  AI_SECURITY_HOST: "ai-security.payment-gateway.svc.cluster.local"
  AI_SECURITY_PORT: "50051"

  METRIC_EMAIL_ADDR: "8080"
  METRIC_AUTH_ADDR: "8081"
  METRIC_ROLE_ADDR: "8082"
  METRIC_CARD_ADDR: "8083"
  METRIC_MERCHANT_ADDR: "8084"
  METRIC_USER_ADDR: "8085"
  METRIC_SALDO_ADDR: "8086"
  METRIC_TOPUP_ADDR: "8087"
  METRIC_TRANSACTION_ADDR: "8088"
  METRIC_TRANSFER_ADDR: "8089"
  METRIC_WITHDRAW_ADDR: "8090"
