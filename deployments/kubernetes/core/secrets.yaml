apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore yang sama dengan app-secrets (dibuat di luar repo).
    name: payment-gateway-secrets
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    # Docker config JSON dengan read:packages ke ghcr.io/<owner>/microservice-payment-gateway-grpc.
    # Dipakai lewat imagePullSecrets di semua Deployment aplikasi — lihat
    # components/image-pull-secret/. Tanpa secret ini pod gagal start
    # ("Unable to retrieve some image pull secrets"), bukan cuma gagal pull.
    - secretKey: .dockerconfigjson
      remoteRef:
        key: payment-gateway/GHCR_DOCKERCONFIGJSON
