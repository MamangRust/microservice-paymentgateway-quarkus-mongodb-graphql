apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Konfigurasi bersama untuk semua pod aplikasi.
resources:
  - namespace.yaml # Namespace payment-gateway (di core/ supaya overlay bisa mewarisinya)
  - configmaps.yaml # ConfigMap app-config
  - serviceaccounts.yaml # ServiceAccount app (tanpa Role/RoleBinding, tanpa token)
  - external-secrets.yaml # ExternalSecret app-secrets (tanpa plaintext di git)
  - secrets.yaml # ExternalSecret ghcr-pull-secret (dockerconfigjson untuk imagePullSecrets)
