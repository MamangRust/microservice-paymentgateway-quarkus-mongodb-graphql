apiVersion: apps/v1
kind: Deployment
metadata:
  name: card
  namespace: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: card
  template:
    metadata:
      labels:
        app: card
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for Kafka to be ready (TCP)..."
              until nc -z kafka.payment-gateway.svc.cluster.local 9092; do
                echo "Kafka is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] Kafka is ready!"
        - name: wait-for-redis-cluster
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for Redis Cluster nodes to be ready..."
              until nc -z redis-0.redis.payment-gateway.svc.cluster.local 6379; do
                echo "Redis Cluster node 0 is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] Redis Cluster is accessible!"

        - name: wait-for-mongo-payment
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB (payment) to be ready (TCP)..."
              until nc -z mongo-payment.payment-gateway.svc.cluster.local 27017; do
                echo "MongoDB payment is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB payment is accessible!"
      containers:
        - name: card
          image: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/card:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8083
            - containerPort: 50053
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
