apiVersion: apps/v1
kind: Deployment
metadata:
  name: topup
  namespace: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: topup
  template:
    metadata:
      labels:
        app: topup
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for Kafka to be ready (TCP)..."
              until nc -z kafka.payment-gateway.svc.cluster.local 9092; do
                echo "Kafka is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] Kafka is ready!"
        - name: wait-for-redis-cluster
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for Redis Cluster nodes to be ready..."
              until nc -z redis-0.redis.payment-gateway.svc.cluster.local 6379; do
                echo "Redis Cluster node 0 is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] Redis Cluster is accessible!"
        - name: wait-for-mongo-financial
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB (financial) to be ready (TCP)..."
              until nc -z mongo-financial.payment-gateway.svc.cluster.local 27017; do
                echo "MongoDB financial is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB financial is accessible!"
      containers:
        - name: topup
          image: ghcr.io/__GHCR_OWNER__/microservice-payment-gateway-grpc/topup:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8087
            - containerPort: 50057
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
