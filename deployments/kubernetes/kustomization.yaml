apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entrypoint (staging/lokal): kubectl apply -k deployments/kubernetes
#
# Manifest dikelompokkan per komponen supaya tidak jadi satu folder berisi 105
# file. Setiap folder yang direferensikan di bawah punya kustomization.yaml
# sendiri (kustomize menolak direktori tanpa file itu).
#
# `namespace:` disamakan dengan repo saudara (ecommerce/pointofsale). Transformer
# ini praktis no-op karena tiap manifest sudah menulis `namespace:
# payment-gateway` sendiri — yang tetap sengaja TIDAK dipakai adalah
# `commonLabels`/`namePrefix`, karena keduanya bisa mengubah Service selector
# sampai kehilangan endpoint. Kustomize di sini murni packaging, bukan patching.
#
# namespace.yaml ada di `core/` (bukan di root) supaya
# overlays/production/ bisa mewarisinya — overlay tidak boleh memuat file biasa
# di luar direktori-nya sendiri.
#
# CATATAN: root ini me-render image sebagai `ghcr.io/__GHCR_OWNER__/...`.
# Untuk workload aplikasi pakai overlays/production (yang mengisi owner dari
# app-config/GHCR_OWNER). Lihat README.

namespace: payment-gateway

resources:
  - core
  - security
  - database
  - messaging
  - cache
  - observability
  - networking
  - services

components:
  - components/image-pull-secret
