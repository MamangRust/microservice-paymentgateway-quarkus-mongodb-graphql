apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payment-gateway-secrets
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Isi alertmanager.yml memuat kredensial SMTP (smtp_smarthost,
    # smtp_auth_username, smtp_auth_password), jadi tidak boleh ikut ter-commit.
    # Nilainya disimpan utuh sebagai satu string di backend secret.
    - secretKey: alertmanager.yml
      remoteRef:
        key: payment-gateway/ALERTMANAGER_CONFIG
