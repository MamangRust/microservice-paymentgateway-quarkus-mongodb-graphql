# docker-compose.infra.yml
#
# Infrastructure-only compose file for local e2e testing.
# Go services run on the host via `go run`; this file provides databases,
# message broker, cache, and analytics store inside Docker.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml --profile monitoring up -d   # + jaeger/otel/prometheus/grafana

name: e2e-infra

services:
  # ─── MongoDB: 1 database = 1 bounded context (PGTOMONGODB.md §1.1), tanpa
  # pooler. Service di host connect lewat port host 27017/27018/27019 memakai
  # .env (MONGO_<CONTEXT>_HOST=localhost). ──────────────────────────────────
  mongo_identity:
    image: mongo:7
    container_name: e2e-mongo-identity
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_identity_data:/data/db
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo_payment:
    image: mongo:7
    container_name: e2e-mongo-payment
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_payment_data:/data/db
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo_financial:
    image: mongo:7
    container_name: e2e-mongo-financial
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "27019:27017"
    volumes:
      - mongo_financial_data:/data/db
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis (single node for local dev) ────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: e2e-redis
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6379:6379"
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dragon_knight", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (single-node KRaft) ────────────────────────────────────────
  kafka:
    image: apache/kafka:4.3.1
    container_name: e2e-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # CLUSTER_ID (bukan KAFKA_CLUSTER_ID) adalah key yang dibaca
      # /etc/kafka/docker/configure; nilai lama diabaikan dan image jatuh ke
      # default bawaannya.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 3000
      KAFKA_CONTROLLER_QUORUM_RETRY_BACKOFF_MS: 500
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092 && echo ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Kafka topic bootstrap (one-shot) ─────────────────────────────────
  # Creates the stats topics the CommandServices now produce into (via the
  # transactional outbox) and that stats-writer / ai-security consume. Runs once
  # Kafka is healthy, then exits.
  kafka-topic-init:
    image: apache/kafka:4.3.1
    container_name: e2e-kafka-topic-init
    networks:
      - e2e
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Creating stats Kafka topics..."
        for topic in \
          stats.payment.transaction.event \
          stats.payment.topup.event \
          stats.payment.transfer.event \
          stats.payment.withdraw.event \
          stats.payment.saldo.event \
          stats.payment.merchant.event \
          stats.payment.card.event; do
          kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --replication-factor 1 \
            --partitions 1 \
            --topic "$$topic"
        done
        echo "All stats topics created (or already exist)."
    restart: "no"

  # ─── ClickHouse (analytics / stats) ───────────────────────────────────  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: e2e-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - e2e
    environment:
      CLICKHOUSE_USER: dragon
      CLICKHOUSE_PASSWORD: dragon_knight
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Observability (optional, enable with --profile monitoring) ────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: e2e-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - e2e
    profiles:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: e2e-jaeger
    ports:
      - "16686:16686"
    networks:
      - e2e
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: e2e-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ../../observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - e2e
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: e2e-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - e2e
    depends_on:
      - prometheus
      - jaeger
    profiles:
      - monitoring

volumes:
  mongo_identity_data:
  mongo_payment_data:
  mongo_financial_data:
  clickhouse_data:

networks:
  e2e:
    driver: bridge
